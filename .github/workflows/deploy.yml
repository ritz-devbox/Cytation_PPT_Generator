name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate access-token configuration
        env:
          ACCESS_TOKEN_HASH: ${{ secrets.VITE_ACCESS_TOKEN_HASH }}
        run: |
          if [[ ! "$ACCESS_TOKEN_HASH" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "VITE_ACCESS_TOKEN_HASH must be configured as a 64-character SHA-256 hash."
            exit 1
          fi
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ACCESS_TOKEN_HASH: ${{ secrets.VITE_ACCESS_TOKEN_HASH }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
